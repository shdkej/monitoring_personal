# Grafana 데이터소스 프로비저닝 설정
# Grafana 시작 시 자동으로 데이터소스를 설정함

# apiVersion: Grafana 프로비저닝 API 버전
apiVersion: 1

# 기존 데이터소스 삭제 (프로비저닝 갱신 시 충돌 방지)
deleteDatasources:
  - name: Prometheus
    orgId: 1
  - name: Loki
    orgId: 1

# 데이터소스 목록 (여러 개 정의 가능)
datasources:
  # Prometheus 데이터소스
  - name: Prometheus              # Grafana에서 표시될 데이터소스 이름
    type: prometheus              # 데이터소스 타입 (prometheus, mysql, postgres 등)
    access: proxy                 # 접근 방식: proxy(Grafana 서버를 통해 접근) 또는 direct(브라우저에서 직접 접근)
    uid: prometheus               # 대시보드에서 참조할 고유 ID

    # url: Prometheus 서버 주소 (Docker Compose 네트워크 내 서비스명 사용)
    url: http://prometheus:9090

    # isDefault: 기본 데이터소스로 설정 (대시보드에서 자동 선택됨)
    isDefault: true

    # editable: Grafana UI에서 수정 가능 여부
    # false로 설정하면 코드로만 관리 (권장)
    editable: false

    # jsonData: 추가 설정 옵션
    jsonData:
      # httpMethod: Prometheus 쿼리 시 사용할 HTTP 메서드
      # POST가 GET보다 긴 쿼리를 안정적으로 처리
      httpMethod: POST

      # timeInterval: 최소 스크랩 간격 (Prometheus의 scrape_interval과 동일하게 설정)
      timeInterval: 15s

  # Loki 데이터소스 (로그 수집)
  - name: Loki
    type: loki
    access: proxy
    uid: loki

    # url: Loki 서버 주소
    url: http://loki:3100

    # 기본 데이터소스 아님 (Prometheus가 기본)
    isDefault: false

    editable: false

    jsonData:
      # Loki 관련 설정
      maxLines: 1000
