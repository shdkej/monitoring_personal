# Grafana 대시보드 프로비저닝 설정
# Grafana 시작 시 자동으로 대시보드를 로드함

# apiVersion: Grafana 프로비저닝 API 버전
apiVersion: 1

# 대시보드 제공자 목록
providers:
  # 5개 레이어 모니터링 대시보드
  - name: 'layer-dashboards'
    orgId: 1
    folder: '5 Layer Monitoring'
    type: file
    disableDeletion: true
    updateIntervalSeconds: 10
    allowUiUpdates: false
    options:
      path: /etc/grafana/provisioning/dashboards
      # layer-*.json 파일들이 자동으로 로드됨
