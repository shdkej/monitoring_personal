version: "3.8"

# 미니멀 모니터링 스택
# - Prometheus: 메트릭 수집 및 저장
# - Alertmanager: 알림 관리 및 Slack 연동
# - Grafana: 시각화 대시보드
# - Node Exporter: 시스템 메트릭 수집
# - Loki: 로그 수집 및 저장
# - Promtail: 로그 수집 에이전트
# - Mock Exporter: 프로덕트/비즈니스 메트릭 시뮬레이터

services:
  # Prometheus: 메트릭 수집 시계열 데이터베이스
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus-minimal
    restart: unless-stopped
    # 설정 파일 및 데이터 디렉토리 마운트
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro # Alert rules 디렉토리
      - prometheus_minimal_data:/prometheus
    # Prometheus 실행 옵션
    command:
      - "--config.file=/etc/prometheus/prometheus.yml" # 설정 파일 경로
      - "--storage.tsdb.path=/prometheus" # 데이터 저장 경로
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.enable-lifecycle" # 설정 리로드 API 활성화
    ports:
      - "9090:9090" # Prometheus Web UI 및 API 포트
    networks:
      - monitoring
    depends_on:
      - alertmanager # Alertmanager가 먼저 시작되어야 함

  # Alertmanager: 알림 관리 및 라우팅
  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager-minimal
    restart: unless-stopped
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_minimal_data:/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    ports:
      - "9093:9093" # Alertmanager Web UI 및 API 포트
    networks:
      - monitoring

  # Grafana: 메트릭 시각화 대시보드
  grafana:
    image: grafana/grafana:latest
    container_name: grafana-minimal
    restart: unless-stopped
    # 환경변수: Grafana 기본 설정
    environment:
      - GF_SECURITY_ADMIN_USER=admin # 관리자 계정 (기본값: admin)
      - GF_SECURITY_ADMIN_PASSWORD=admin # 관리자 비밀번호
      - GF_USERS_ALLOW_SIGN_UP=false # 신규 사용자 가입 비활성화
    # 볼륨 마운트: 데이터 영구 저장 및 프로비저닝 설정
    volumes:
      - grafana_minimal_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3050:3000" # Grafana Web UI 포트
    networks:
      - monitoring
    depends_on:
      - prometheus # Prometheus가 먼저 시작되어야 함
      - loki # Loki가 먼저 시작되어야 함

  # Node Exporter: 호스트 시스템 메트릭 수집
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter-minimal
    restart: unless-stopped
    # 호스트 시스템 정보 수집을 위한 볼륨 마운트
    volumes:
      - /proc:/host/proc:ro # 프로세스 정보
      - /sys:/host/sys:ro # 시스템 정보
      - /:/rootfs:ro # 루트 파일시스템 (읽기 전용)
    # Node Exporter 실행 옵션
    command:
      - "--path.procfs=/host/proc" # /proc 경로 지정
      - "--path.sysfs=/host/sys" # /sys 경로 지정
      - "--path.rootfs=/rootfs" # 루트 파일시스템 경로
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)" # 특정 마운트 포인트 제외
    ports:
      - "9100:9100" # Node Exporter 메트릭 포트
    networks:
      - monitoring

  # Loki: 로그 수집 및 저장
  loki:
    image: grafana/loki:2.9.0
    container_name: loki-minimal
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./loki:/etc/loki
      - loki_minimal_data:/loki
    command: -config.file=/etc/loki/loki-config.yaml
    networks:
      - monitoring

  # Promtail: 로그 수집 에이전트
  promtail:
    image: grafana/promtail:2.9.0
    container_name: promtail-minimal
    restart: unless-stopped
    volumes:
      - ./promtail:/etc/promtail
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/promtail-config.yaml
    networks:
      - monitoring
    depends_on:
      - loki

  # YACE: AWS CloudWatch Lambda 메트릭 수집
  yace:
    image: prometheuscommunity/yet-another-cloudwatch-exporter:latest
    container_name: yace-minimal
    restart: unless-stopped
    volumes:
      - ./yace/config.yml:/etc/yace/config.yml:ro
    env_file:
      - ./yace/.env
    ports:
      - "5123:5000"
    networks:
      - monitoring

  # PostHog Exporter: 제품 지표 (PostHog Cloud US Query API → Prometheus 브리지)
  posthog-exporter:
    build: ./posthog-exporter
    container_name: posthog-exporter
    restart: unless-stopped
    environment:
      - POSTHOG_ACCESS_TOKEN=${POSTHOG_ACCESS_TOKEN}
      - POSTHOG_HOST=${POSTHOG_HOST:-https://us.posthog.com}
      - POSTHOG_PROJECTS=${POSTHOG_PROJECTS:-virtue:424014}
      - PRODUCT_APPS=${PRODUCT_APPS:-virtue,blog,afzma}
      - POSTHOG_FUNNELS=${POSTHOG_FUNNELS:-virtue:deed_judge_attempted:deed_saved}
    ports:
      - "9101:9101"
    networks:
      monitoring:
        aliases:
          - posthog-exporter

# 네트워크 정의: 서비스 간 통신을 위한 격리된 네트워크
networks:
  monitoring:
    driver: bridge # 브리지 네트워크 드라이버 사용

# 볼륨 정의: 데이터 영구 저장
volumes:
  prometheus_minimal_data: # Prometheus 시계열 데이터
  alertmanager_minimal_data: # Alertmanager 알림 상태 데이터
  grafana_minimal_data: # Grafana 대시보드 및 설정 데이터
  loki_minimal_data: # Loki 로그 데이터
