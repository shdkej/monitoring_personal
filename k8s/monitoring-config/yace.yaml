---
apiVersion: v1
kind: ConfigMap
metadata:
  name: yace-config
  namespace: monitoring
data:
  config.yml: |
    apiVersion: v1alpha1
    discovery:
      jobs:
        - type: AWS/Lambda
          regions: [ap-northeast-2, eu-central-1]
          period: 300
          length: 300
          metrics:
            - name: Invocations
              statistics: [Sum]
            - name: Duration
              statistics: [Average, p50, p99]
            - name: Errors
              statistics: [Sum]
            - name: Throttles
              statistics: [Sum]
            - name: ConcurrentExecutions
              statistics: [Maximum]
        - type: AWS/DynamoDB
          regions: [ap-northeast-2]
          period: 300
          length: 300
          metrics:
            - name: ConsumedReadCapacityUnits
              statistics: [Sum]
            - name: ConsumedWriteCapacityUnits
              statistics: [Sum]
            - name: ReadThrottleEvents
              statistics: [Sum]
            - name: WriteThrottleEvents
              statistics: [Sum]
            - name: SuccessfulRequestLatency
              statistics: [Average, p99]
            - name: SystemErrors
              statistics: [Sum]
            - name: UserErrors
              statistics: [Sum]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yace
  namespace: monitoring
  labels:
    app: yace
spec:
  replicas: 1
  selector:
    matchLabels:
      app: yace
  template:
    metadata:
      labels:
        app: yace
    spec:
      containers:
        - name: yace
          image: prometheuscommunity/yet-another-cloudwatch-exporter:latest
          ports:
            - containerPort: 5000
          envFrom:
            - secretRef:
                name: yace-aws-credentials
          volumeMounts:
            - name: config
              mountPath: /etc/yace/config.yml
              subPath: config.yml
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: yace-config
---
apiVersion: v1
kind: Service
metadata:
  name: yace
  namespace: monitoring
  labels:
    app: yace
spec:
  selector:
    app: yace
  ports:
    - port: 5000
      targetPort: 5000
      name: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: yace
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: yace
  endpoints:
    - port: metrics
      interval: 300s
