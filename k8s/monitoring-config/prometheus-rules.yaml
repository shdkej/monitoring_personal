# =============================================================================
# PrometheusRule CRD (Minimal Set)
# Keep only 3 essential alerts:
# 1) NodeDown
# 2) KubePodCrashLooping
# 3) NodeMemoryPressure
# =============================================================================
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: monitoring-personal-alerts
  labels:
    app.kubernetes.io/part-of: monitoring-personal
    rule_source: monitoring-personal
spec:
  groups:
    - name: essential_alerts
      rules:
        - alert: NodeDown
          expr: probe_success{job="blackbox-tcp"} == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "노드 다운 감지"
            description: "{{ $labels.instance }}가 1분 이상 TCP 연결에 응답하지 않습니다."
            dashboard_url: "https://grafana.oracle.shdkej.com/d/layer-system/layer-3"

        - alert: KubePodCrashLooping
          expr: max_over_time(kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"}[5m]) >= 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Pod CrashLoopBackOff 감지"
            description: "{{ $labels.namespace }}/{{ $labels.pod }} 컨테이너가 CrashLoopBackOff 상태를 지속하고 있습니다."
            dashboard_url: "https://grafana.oracle.shdkej.com/d/main-overview/main"

        - alert: NodeMemoryPressure
          expr: kube_node_status_condition{condition="MemoryPressure", status="true"} == 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "노드 메모리 압박 감지"
            description: "{{ $labels.node }} 노드가 MemoryPressure 상태입니다."
            dashboard_url: "https://grafana.oracle.shdkej.com/d/layer-system/layer-3?viewPanel=memory"
