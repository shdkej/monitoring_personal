# =============================================================================
# PrometheusRule CRD
# monitoring_personal/prometheus/rules/alerts.yml 을 K8s CRD로 변환
# Prometheus Operator가 label selector로 자동 발견
# =============================================================================
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: monitoring-personal-alerts
  labels:
    app.kubernetes.io/part-of: monitoring-personal
    release: kube-prometheus-stack
    rule_source: monitoring-personal
spec:
  groups:
    # 시스템 리소스 알림
    - name: system_alerts
      rules:
        - alert: HighCpuUsage
          expr: (100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)) * on(instance) group_left(nodename) node_uname_info > 70
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "높은 CPU 사용률 감지"
            description: '{{ $labels.nodename }}의 CPU 사용률이 5분 이상 70%를 초과했습니다. (현재: {{ $value | printf "%.1f" }}%)'
            dashboard_url: "https://grafana.oracle.shdkej.com/d/layer-system/layer-3?viewPanel=cpu"

        - alert: CriticalCpuUsage
          expr: (100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)) * on(instance) group_left(nodename) node_uname_info > 95
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "위험 수준의 CPU 사용률"
            description: '{{ $labels.nodename }}의 CPU 사용률이 95%를 초과했습니다. (현재: {{ $value | printf "%.1f" }}%)'
            dashboard_url: "https://grafana.oracle.shdkej.com/d/layer-system/layer-3?viewPanel=cpu"

        - alert: HighMemoryUsage
          expr: ((1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100) * on(instance) group_left(nodename) node_uname_info > 70
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "높은 메모리 사용률 감지"
            description: '{{ $labels.nodename }}의 메모리 사용률이 5분 이상 70%를 초과했습니다. (현재: {{ $value | printf "%.1f" }}%)'
            dashboard_url: "https://grafana.oracle.shdkej.com/d/layer-system/layer-3?viewPanel=memory"

        - alert: CriticalMemoryUsage
          expr: ((1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100) * on(instance) group_left(nodename) node_uname_info > 95
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "위험 수준의 메모리 사용률"
            description: '{{ $labels.nodename }}의 메모리 사용률이 95%를 초과했습니다. (현재: {{ $value | printf "%.1f" }}%)'
            dashboard_url: "https://grafana.oracle.shdkej.com/d/layer-system/layer-3?viewPanel=memory"

    # 서비스 상태 알림
    - name: service_alerts
      rules:
        - alert: HostDown
          expr: up{job="node-exporter"} == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "호스트 종료 또는 Node Exporter 다운"
            description: "{{ $labels.instance }} 호스트가 1분 이상 시스템 메트릭에 응답하지 않습니다. 호스트 종료, 네트워크 단절, 또는 Node Exporter 장애일 수 있습니다."
            dashboard_url: "https://grafana.oracle.shdkej.com/d/layer-system/layer-3"

        - alert: TargetDown
          expr: up{job!="node-exporter"} == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "모니터링 타겟 다운"
            description: "{{ $labels.job }}의 {{ $labels.instance }}가 1분 이상 응답하지 않습니다."
            dashboard_url: "https://grafana.oracle.shdkej.com/d/main-overview/main"

        - alert: PrometheusConfigReloadFailed
          expr: prometheus_config_last_reload_successful == 0
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "Prometheus 설정 리로드 실패"
            description: "Prometheus 설정 파일 리로드에 실패했습니다. 설정 파일을 확인하세요."
            dashboard_url: "https://grafana.oracle.shdkej.com/d/main-overview/main"

    # 노드 생존 알림 (Blackbox TCP probe)
    - name: blackbox_alerts
      rules:
        - alert: NodeDown
          expr: probe_success{job="blackbox-tcp"} == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "노드 다운 감지"
            description: "{{ $labels.instance }}가 1분 이상 TCP 연결에 응답하지 않습니다."
            dashboard_url: "https://grafana.oracle.shdkej.com/d/layer-system/layer-3"

        - alert: NodeHighLatency
          expr: probe_duration_seconds{job="blackbox-tcp"} > 2
          for: 3m
          labels:
            severity: warning
          annotations:
            summary: "노드 응답 지연"
            description: '{{ $labels.instance }}의 TCP 응답 시간이 2초를 초과했습니다. (현재: {{ $value | printf "%.2f" }}초)'
            dashboard_url: "https://grafana.oracle.shdkej.com/d/layer-system/layer-3"

    # 네트워크 알림
    - name: network_alerts
      rules:
        - alert: HighNetworkReceive
          expr: rate(node_network_receive_bytes_total{device!~"lo|veth.*|docker.*|br-.*"}[5m]) * on(instance) group_left(nodename) node_uname_info > 100000000
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "높은 네트워크 수신 트래픽"
            description: "{{ $labels.nodename }}의 {{ $labels.device }} 인터페이스에서 높은 수신 트래픽이 감지되었습니다. ({{ $value | humanize }}B/s)"
            dashboard_url: "https://grafana.oracle.shdkej.com/d/layer-system/layer-3?viewPanel=network"

        - alert: HighNetworkTransmit
          expr: rate(node_network_transmit_bytes_total{device!~"lo|veth.*|docker.*|br-.*"}[5m]) * on(instance) group_left(nodename) node_uname_info > 100000000
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "높은 네트워크 송신 트래픽"
            description: "{{ $labels.nodename }}의 {{ $labels.device }} 인터페이스에서 높은 송신 트래픽이 감지되었습니다. ({{ $value | humanize }}B/s)"
            dashboard_url: "https://grafana.oracle.shdkej.com/d/layer-system/layer-3?viewPanel=network"
