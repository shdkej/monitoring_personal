apiVersion: v1
kind: ConfigMap
metadata:
  name: yace-prometheus-yet-another-cloudwatch-exporter
  namespace: monitoring
data:
  config.yml: |
    apiVersion: v1alpha1
    discovery:
      jobs:
        - type: AWS/Lambda
          regions: [ap-northeast-2]
          period: 600
          length: 600
          metrics:
            - name: Invocations
              statistics: [Sum]
            - name: Duration
              statistics: [Average, p50, p99]
            - name: Errors
              statistics: [Sum]
            - name: Throttles
              statistics: [Sum]
            - name: ConcurrentExecutions
              statistics: [Maximum]
        - type: AWS/DynamoDB
          regions: [ap-northeast-2]
          period: 600
          length: 600
          metrics:
            - name: ConsumedReadCapacityUnits
              statistics: [Sum]
            - name: ConsumedWriteCapacityUnits
              statistics: [Sum]
            - name: ReadThrottleEvents
              statistics: [Sum]
            - name: WriteThrottleEvents
              statistics: [Sum]
            - name: SuccessfulRequestLatency
              statistics: [Average, p99]
            - name: SystemErrors
              statistics: [Sum]
            - name: UserErrors
              statistics: [Sum]
        - type: AWS/RUM
          regions: [ap-northeast-2]
          period: 600
          length: 600
          metrics:
            - name: WebVitalsLargestContentfulPaint
              statistics: [Average, p90]
            - name: WebVitalsFirstInputDelay
              statistics: [Average, p90]
            - name: WebVitalsCumulativeLayoutShift
              statistics: [Average, p90]
            - name: JsErrorCount
              statistics: [Sum]
            - name: HttpErrorCount
              statistics: [Sum]
            - name: SessionCount
              statistics: [Sum]
            - name: NavigationFrustratedTransaction
              statistics: [Sum]
            - name: PerformanceNavigationDuration
              statistics: [Average, p95, p99]

    # Daily S3 metrics do not require tagged buckets or paid request-metric opt-in.
    customNamespace:
      - name: s3-storage
        namespace: AWS/S3
        regions: [ap-northeast-2, ap-northeast-1, ap-south-1, us-east-1, eu-central-1]
        dimensionNameRequirements: [BucketName, StorageType]
        period: 86400
        length: 259200
        nilToZero: false
        addCloudwatchTimestamp: false
        metrics:
          - name: BucketSizeBytes
            statistics: [Average]
          - name: NumberOfObjects
            statistics: [Average]
    static:
      - name: s3-monthly-charge
        namespace: AWS/Billing
        regions: [us-east-1]
        dimensions:
          - name: ServiceName
            value: AmazonS3
          - name: Currency
            value: USD
        metrics:
          - name: EstimatedCharges
            statistics: [Maximum]
            period: 21600
            length: 172800
            nilToZero: false
            addCloudwatchTimestamp: false
