apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: agent-metrics
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames: [default]
  selector:
    matchLabels: {app: agent-metrics}
  endpoints:
    - port: metrics
      path: /metrics
      interval: 1m
