# posthog-exporter Deployment
# 커스텀 이미지 없이 node:20-alpine에서 런타임에 monitoring_personal을 clone → 실행
# (virtue-rebirth와 동일 패턴 — 이미지 레지스트리 불필요)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: posthog-exporter
  labels:
    app: posthog-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: posthog-exporter
  template:
    metadata:
      labels:
        app: posthog-exporter
    spec:
      volumes:
        - name: analytics-threads
          secret:
            secretName: analytics-threads-api
            optional: true
        - name: market-trends
          secret:
            secretName: market-trends-naver
            optional: true
        - name: analytics-gmail
          secret:
            secretName: analytics-gmail-api
            optional: true
        - name: customer-support
          configMap:
            name: customer-support-counts
            optional: true
        - name: analytics-ga4
          secret:
            secretName: grafana-ga4-credentials
            optional: true
            items:
              - key: GA4_PRIVATE_KEY
                path: credentials.json
        - name: analytics-instagram
          secret:
            secretName: analytics-instagram-api
            optional: true
        - name: ga4-engagement
          configMap:
            name: ga4-session-engagement
            optional: true
      containers:
        - name: exporter
          image: node:20-alpine
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: analytics-threads
              mountPath: /etc/analytics-threads
              readOnly: true
            - name: market-trends
              mountPath: /etc/market-trends
              readOnly: true
            - name: analytics-gmail
              mountPath: /etc/analytics-gmail
              readOnly: true
            - name: customer-support
              mountPath: /etc/customer-support
              readOnly: true
            - name: analytics-ga4
              mountPath: /etc/analytics-ga4
              readOnly: true
            - name: analytics-instagram
              mountPath: /etc/analytics-instagram
              readOnly: true
            - name: ga4-engagement
              mountPath: /etc/ga4-engagement
              readOnly: true
          workingDir: /tmp
          # 런타임 clone은 컨테이너 시작 때만 수행하므로 exporter 소스 변경 시 SOURCE_REVISION도 갱신한다.
          env:
            - name: SOURCE_REVISION
              value: "app-inventory-afzma-2026-11-28"
            - name: GMAIL_GOG_ENABLED
              value: "true"
            - name: GA4_API_ENABLED
              value: "true"
            - name: INSTAGRAM_API_ENABLED
              value: "true"
            - name: POSTHOG_HOST
              value: https://us.posthog.com
            # Personal API Key는 민감정보 → Secret 참조 (repo가 public이므로 평문 금지)
            # 생성: kubectl -n monitoring create secret generic posthog-credentials \
            #         --from-literal=access-token='phx_...'
            - name: POSTHOG_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: posthog-credentials
                  key: access-token
          ports:
            - containerPort: 9101
              name: metrics
          command:
            - /bin/sh
            - -ec
            - |
              apk add --no-cache git
              rm -rf /app
              git clone --depth=1 --branch master https://github.com/shdkej/monitoring_personal.git /app
              cd /app/posthog-exporter
              npm install --omit=dev
              node index.js
          readinessProbe:
            httpGet:
              path: /health
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 18
          livenessProbe:
            httpGet:
              path: /health
              port: metrics
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 4
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
