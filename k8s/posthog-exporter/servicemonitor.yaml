# Prometheus Operator가 자동 감지하도록 release 라벨을 kube-prometheus-stack으로
# (YACE와 동일 — Prometheus serviceMonitorSelector가 이 라벨을 매칭)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: posthog-exporter
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: posthog-exporter
  endpoints:
    - port: metrics
      path: /metrics
      interval: 5m
      # exporter가 노출한 service=virtue/blog/afzma 레이블을 target 레이블(service=posthog-exporter)이
      # 덮어쓰지 않도록 메트릭 레이블 우선. (없으면 대시보드 service="virtue" 쿼리가 No data)
      honorLabels: true
